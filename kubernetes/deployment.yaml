apiVersion: apps/v1
kind: Deployment

metadata:
  name: petclinic
  namespace: petclinic-devops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: petclinic

  template:
    metadata:
      labels:
        app: petclinic

    spec:
      containers:
        - name: petclinic
          image: abhinavsingh6557/petclinic-devops:latest

          ports:
            - containerPort: 8080

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"

            limits:
              memory: "600Mi"
              cpu: "500m"

          startupProbe:
            httpGet:
              path: /
              port: 8080
            failureThreshold: 60
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
