name: PetClinic CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build application
        run: |
          cd application
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Run tests
        run: |
          cd application
          ./mvnw test
